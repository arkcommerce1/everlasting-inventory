<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everlasting Ice Rx - Warehouse Inventory</title>
<style>
  :root { --navy:#091B30; --ice:#85E2FF; --yes:#16a34a; --no:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:#f3f6f9; color:#111827; }
  header { background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:700; letter-spacing:.3px; }
  header .sub { color:var(--ice); font-size:12px; margin-top:2px; }
  header .right { margin-left:auto; text-align:right; font-size:12px; color:#cbd5e1; }
  header .right button { background:var(--ice); color:var(--navy); border:0; border-radius:6px; padding:7px 14px; font-weight:700; cursor:pointer; font-size:13px; }
  .bar { padding:12px 18px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar input { flex:1; min-width:200px; max-width:420px; padding:9px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
  .legend { font-size:12px; color:#4b5563; display:flex; gap:12px; align-items:center; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .summary { padding:8px 18px 0; font-size:12px; color:#4b5563; }
  .wrap { padding:12px 18px 30px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:760px; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(9,27,48,.12); }
  thead th { background:var(--navy); color:#fff; font-size:12px; text-align:center; padding:10px 8px; }
  thead th:nth-child(1), thead th:nth-child(2) { text-align:left; }
  tbody td { padding:8px; border-top:1px solid #eef2f6; font-size:13px; text-align:center; }
  tbody td.sku { font-weight:700; color:var(--navy); text-align:left; white-space:nowrap; }
  tbody td.name { color:#374151; text-align:left; }
  tbody tr:hover { background:#f0f9ff; }
  .pill { display:inline-block; min-width:46px; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:700; }
  .pill.yes { background:#dcfce7; color:var(--yes); }
  .pill.no { background:#f3f4f6; color:var(--no); font-weight:400; }
  .qty { display:block; font-size:10px; font-weight:400; color:#6b7280; margin-top:1px; }
  .err { margin:18px; padding:12px; background:#fee2e2; color:#991b1b; border-radius:8px; font-size:13px; }
  .loading { margin:40px; text-align:center; color:#6b7280; font-size:14px; }
  footer { padding:0 18px 24px; font-size:11px; color:#9ca3af; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Everlasting Ice Rx</h1>
    <div class="sub">Warehouse inventory - refreshed every 6 hours</div>
  </div>
  <div class="right">
    <div id="updated">loading...</div>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search SKU or product name...">
  <div class="legend">
    <span><span class="dot" style="background:var(--yes)"></span>In stock</span>
    <span><span class="dot" style="background:var(--no)"></span>None</span>
  </div>
</div>
<div class="summary" id="summary"></div>
<div class="wrap" id="wrap"><div class="loading">Loading inventory...</div></div>
<footer>Counts over 100 show as 100. Source: master list, updated daily.</footer>
<script>
var GVIZ_URL = 'https://docs.google.com/spreadsheets/d/1XAcrCSO-uOR1Z3ChKCkxkEWclOFRsfDdWen7K05BVpk/gviz/tq?tqx=out:json&headers=1';
var WAREHOUSES = [
  { label: 'WP (LA)',   col: 2 },
  { label: 'JCT (LA)',  col: 3 },
  { label: 'TFS (LA)',  col: 4 },
  { label: 'JNJ (NJ)',  col: 5 },
  { label: 'GLDI (NJ)', col: 6 },
  { label: 'FBA',       col: 8 }
];
var DATA = null;

function cellQty(c) {
  if (!c || c.v === null || c.v === undefined) return 0; // blank or #N/A = zero
  var n = Number(c.v);
  if (isNaN(n) || n <= 0) return 0;
  return n;
}

function parseGviz(text) {
  var s = text.indexOf('setResponse(');
  var json = JSON.parse(text.substring(s + 12, text.lastIndexOf(');')));
  var rows = [];
  json.table.rows.forEach(function(r) {
    var c = r.c || [];
    var sku = (c[0] && c[0].v ? String(c[0].v) : '').trim();
    if (!sku) return;
    var row = { sku: sku, name: (c[1] && c[1].v ? String(c[1].v) : '').trim(), wh: {} };
    WAREHOUSES.forEach(function(w) { row.wh[w.label] = cellQty(c[w.col]); });
    rows.push(row);
  });
  return rows;
}

function render() {
  var wrap = document.getElementById('wrap');
  var q = document.getElementById('q').value.trim().toLowerCase();
  var rows = DATA.filter(function(r) {
    return !q || r.sku.toLowerCase().indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1;
  });
  var anyStock = 0;
  DATA.forEach(function(r) {
    for (var i = 0; i < WAREHOUSES.length; i++) { if (r.wh[WAREHOUSES[i].label] > 0) { anyStock++; break; } }
  });
  document.getElementById('summary').textContent =
    rows.length + ' of ' + DATA.length + ' SKUs shown - ' + anyStock + ' SKUs in stock in at least one location';
  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  ['SKU', 'Product'].concat(WAREHOUSES.map(function(w){ return w.label; })).forEach(function(h) {
    var th = document.createElement('th'); th.textContent = h; hr.appendChild(th);
  });
  thead.appendChild(hr); table.appendChild(thead);
  var tbody = document.createElement('tbody');
  rows.forEach(function(r) {
    var tr = document.createElement('tr');
    var td = document.createElement('td'); td.className = 'sku'; td.textContent = r.sku; tr.appendChild(td);
    td = document.createElement('td'); td.className = 'name'; td.textContent = r.name; tr.appendChild(td);
    WAREHOUSES.forEach(function(w) {
      var qty = r.wh[w.label];
      var cell = document.createElement('td');
      var pill = document.createElement('span');
      if (qty > 0) {
        pill.className = 'pill yes'; pill.textContent = 'Yes';
        cell.appendChild(pill);
        var qy = document.createElement('span'); qy.className = 'qty';
        qy.textContent = Math.min(qty, 100) + ' units';
        cell.appendChild(qy);
      } else {
        pill.className = 'pill no'; pill.textContent = 'No';
        cell.appendChild(pill);
      }
      tr.appendChild(cell);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.innerHTML = ''; wrap.appendChild(table);
}

function fmtET(iso) {
  var d = new Date(iso);
  return d.toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ET';
}

function showError(e) {
  var wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  var d = document.createElement('div'); d.className = 'err';
  d.textContent = 'Could not load inventory: ' + e.message;
  wrap.appendChild(d);
}

// Default view: the 6-hourly snapshot (data.json, committed by a scheduled job).
function load() {
  document.getElementById('updated').textContent = 'loading...';
  fetch('data.json?_=' + Date.now())
    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function(j) {
      DATA = j.rows;
      document.getElementById('updated').textContent = 'Updated ' + fmtET(j.updated) + ' - auto-refresh every 6h';
      render();
    })
    .catch(function() { livePull(); }); // snapshot missing: fall back to a live pull
}

// Refresh button: on-demand live pull straight from the sheet.
function livePull() {
  document.getElementById('updated').textContent = 'pulling live...';
  fetch(GVIZ_URL + '&_=' + Date.now())
    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
    .then(function(text) {
      DATA = parseGviz(text);
      document.getElementById('updated').textContent = 'Live pull ' + fmtET(new Date().toISOString());
      render();
    })
    .catch(showError);
}

document.getElementById('q').addEventListener('input', function() { if (DATA) render(); });
document.getElementById('refresh').addEventListener('click', livePull);
load();
</script>
</body>
</html>
